# Every PR and push to main: typecheck, unit tests, database tests (all
# migrations on a throwaway Postgres) and a production build. A red check
# means don't merge: Vercel deploys main straight to players.
name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Database tests
        run: npm run test:db
      - name: Build
        run: npm run build
        env:
          # Placeholders: the build only needs them to be set.
          NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:1
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder
