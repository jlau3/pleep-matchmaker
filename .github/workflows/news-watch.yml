# Daily heads-up: post new Pokémon Sleep news (pokemonsleep.net) to Discord so
# you know a release is coming. The data refresh job does the actual update.
# The list of seen posts lives in the Actions cache. Needs secret
# DISCORD_WEBHOOK_URL; without it this only logs.
name: News watch

on:
  schedule:
    - cron: "47 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: scripts

      - uses: actions/cache/restore@v4
        with:
          path: .news-seen.json
          key: news-seen-${{ github.run_id }}
          restore-keys: news-seen-

      - name: Check news
        run: python3 scripts/watch_news.py .news-seen.json new-posts.md

      - uses: actions/cache/save@v4
        with:
          path: .news-seen.json
          key: news-seen-${{ github.run_id }}

      - name: Ping Discord
        run: |
          [ -s new-posts.md ] || { echo "Nothing new."; exit 0; }
          [ -n "$DISCORD_WEBHOOK_URL" ] || { echo "No DISCORD_WEBHOOK_URL secret; skipping ping."; cat new-posts.md; exit 0; }
          jq -n --rawfile posts new-posts.md \
            '{content: ("**New Pokémon Sleep news.** The data refresh job will pick up any new Pokémon once upstream data lands.\n" + $posts)[0:1900]}' \
            | curl -sSf -H "Content-Type: application/json" -d @- "$DISCORD_WEBHOOK_URL"
